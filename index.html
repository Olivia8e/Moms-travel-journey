
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>下一站，去哪裡？旅行探索之旅</title>

  <!-- 載入適合繁體中文閱讀的字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* 全站共用色彩與基本設定 */
    :root {
      --cream: #f8f6ef;
      --green: #718b78;
      --dark-green: #425e4a;
      --brown: #766451;
      --text: #514b43;
      --light-green: #e8eee6;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 20px;
      line-height: 1.8;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* 主要內容容器 */
    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 35px 0 60px;
    }

    /* 首頁及結果頁的置中版面 */
    .center {
      text-align: center;
    }

    /* 首頁插畫 */
    .hero-art {
      margin: 25px auto;
      font-size: 85px;
      line-height: 1.4;
    }

    .eyebrow {
      color: var(--green);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    h1 {
      margin: 15px 0;
      color: var(--dark-green);
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1.4;
    }

    h2 {
      color: var(--dark-green);
      font-size: clamp(26px, 4vw, 36px);
      line-height: 1.5;
    }

    .intro {
      max-width: 650px;
      margin: 20px auto 35px;
      color: var(--brown);
      font-size: 21px;
    }

    /* 通用按鈕 */
    .primary-btn {
      min-width: 190px;
      padding: 14px 30px;
      border: none;
      border-radius: 40px;
      background: var(--green);
      color: white;
      font-size: 21px;
      font-weight: 700;
      transition: 0.2s;
    }

    .primary-btn:hover {
      background: var(--dark-green);
      transform: translateY(-2px);
    }

    .secondary-btn {
      padding: 12px 25px;
      border: 2px solid var(--green);
      border-radius: 35px;
      background: transparent;
      color: var(--dark-green);
      font-size: 19px;
    }

    .secondary-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* 測驗進度區域 */
    .progress-area {
      margin-bottom: 35px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      color: var(--brown);
      font-size: 17px;
    }

    .progress-track {
      height: 10px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 20px;
      background: #e5e2d8;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 20px;
      background: var(--green);
      transition: width 0.3s;
    }

    /* 問題卡片 */
    .question-card {
      padding: 35px;
      border: 1px solid #e8e3d8;
      border-radius: 25px;
      background: var(--white);
      box-shadow: 0 8px 30px rgba(80, 70, 50, 0.05);
    }

    .question-number {
      color: var(--green);
      font-size: 18px;
      font-weight: 700;
    }

    .question-description {
      margin: 8px 0 25px;
      color: #8b8174;
      font-size: 18px;
    }

    /* 選項卡片 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .option {
      min-height: 105px;
      padding: 20px;
      border: 2px solid #e8e5dc;
      border-radius: 18px;
      background: #fffefa;
      color: var(--text);
      text-align: left;
      font-size: 20px;
      transition: 0.2s;
    }

    .option:hover {
      border-color: var(--green);
      background: #f5f8f3;
    }

    .option.selected {
      border-color: var(--green);
      background: var(--light-green);
      color: var(--dark-green);
      font-weight: 700;
    }

    .option .emoji {
      display: block;
      margin-bottom: 5px;
      font-size: 30px;
    }

    /* 測驗操作按鈕 */
    .navigation {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 30px;
    }

    .hint {
      min-height: 32px;
      margin-top: 15px;
      color: #a16b4c;
      font-size: 16px;
    }

    /* 結果區域 */
    .result-card {
      margin: 25px 0;
      padding: 25px;
      border: 1px solid #e7e1d7;
      border-radius: 22px;
      background: white;
      text-align: left;
    }

    .rank {
      color: var(--green);
      font-size: 19px;
      font-weight: 700;
    }

    .destination-name {
      margin: 5px 0;
      color: var(--dark-green);
      font-size: 30px;
      font-weight: 700;
    }

    .result-description {
      color: var(--brown);
      font-size: 18px;
    }

    .score-label {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 15px;
      border-radius: 20px;
      background: var(--light-green);
      color: var(--dark-green);
      font-size: 16px;
    }

    .result-note {
      padding: 20px;
      border-radius: 18px;
      background: #f1eee6;
      color: var(--brown);
      font-size: 17px;
    }

    /* 小螢幕適配 */
    @media (max-width: 600px) {
      .container {
        padding-top: 20px;
      }

      .question-card {
        padding: 22px 16px;
      }

      .options-grid {
        grid-template-columns: 1fr;
      }

      .option {
        min-height: 85px;
      }

      .navigation button {
        min-width: 0;
        padding: 12px 18px;
      }
    }

    /* 隱藏尚未顯示的頁面 */
    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- 首頁 -->
    <section id="home" class="center">
      <div class="hero-art">☀️ 🏞️</div>

      <div class="eyebrow">A JOURNEY OF DISCOVERY</div>

      <h1>下一站，去哪裡？</h1>

      <p class="intro">
        每一趟旅行，都藏著一個期待中的自己。<br>
        讓我們用幾個簡單的問題，<br>
        一起找出最適合妳的旅行目的地。
      </p>

      <p>準備好了嗎？這趟旅程大約需要 5 分鐘。</p>

      <button class="primary-btn" onclick="startQuiz()">
        開始探索 →
      </button>
    </section>

    <!-- 問答頁 -->
    <section id="quiz" class="hidden">

      <div class="progress-area">
        <div class="progress-text">
          <span id="progress-label">第 1 題，共 8 題</span>
          <span id="progress-percent">12%</span>
        </div>

        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div class="question-card">

        <div id="question-number" class="question-number"></div>

        <h2 id="question-title"></h2>

        <p id="question-description" class="question-description"></p>

        <div id="options-container" class="options-grid"></div>

        <div id="hint" class="hint"></div>

        <div class="navigation">
          <button
            id="prev-btn"
            class="secondary-btn"
            onclick="previousQuestion()">
            ← 上一題
          </button>

          <button
            id="next-btn"
            class="primary-btn"
            onclick="nextQuestion()">
            下一題 →
          </button>
        </div>

      </div>
    </section>

    <!-- 推薦結果頁 -->
    <section id="result" class="hidden center">

      <div class="hero-art">🌿 ✨ 🌿</div>

      <div class="eyebrow">YOUR NEXT DESTINATION</div>

      <h1>妳的旅行目的地揭曉了</h1>

      <p class="intro">
        根據妳的回答，<br>
        我們為妳找到了三個值得期待的地方。
      </p>

      <div id="result-list"></div>

      <div class="result-note">
        這份推薦是根據妳的偏好所做的初步配對。
        實際旅行仍應考慮季節、天氣、交通、預算及體力。
      </div>

      <br>

      <button class="primary-btn" onclick="restartQuiz()">
        再探索一次
      </button>

    </section>

  </main>

  <script>
    /* =========================================
       一、建立八道題目的資料
       type 為 multi 代表複選，single 代表單選
       tags 代表此選項對應的旅行偏好
       ========================================= */

    const questions = [

      {
        title: "妳嚮往什麼樣的世界？",
        description: "可以選擇最多三種妳喜歡的旅行風格。",
        type: "multi",
        max: 3,
        options: [
          { text: "城市煙火：繁華、時尚、購物與夜景", emoji: "🌃", tags: ["city", "shopping", "night"] },
          { text: "歷史人文：古蹟、文化與傳統建築", emoji: "🏯", tags: ["history", "culture"] },
          { text: "壯麗山水：山川、湖泊與自然風景", emoji: "🏞️", tags: ["nature", "mountain", "water"] },
          { text: "美食之都：特色料理與在地小吃", emoji: "🍜", tags: ["food", "local"] }
        ]
      },

      {
        title: "旅行時最期待什麼？",
        description: "選出最多兩件妳最期待的事情。",
        type: "multi",
        max: 2,
        options: [
          { text: "逛街購物，感受城市活力", emoji: "🛍️", tags: ["shopping", "city"] },
          { text: "欣賞建築、博物館與文化", emoji: "🏛️", tags: ["culture", "history"] },
          { text: "品嚐美食，探索在地市場", emoji: "🥢", tags: ["food", "local"] },
          { text: "欣賞風景，拍下美麗照片", emoji: "📷", tags: ["nature", "water", "mountain"] },
          { text: "喝茶、散步、享受悠閒時光", emoji: "🍵", tags: ["relax", "slow"] },
          { text: "欣賞夜景與熱鬧街景", emoji: "🌙", tags: ["night", "city"] }
        ]
      },

      {
        title: "如果有一天完全沒有行程，妳想怎麼過？",
        description: "選擇最接近妳理想的旅行日常。",
        type: "single",
        options: [
          { text: "睡到自然醒，再慢慢逛街", emoji: "☕", tags: ["slow", "shopping", "city"] },
          { text: "早早出門，走訪景點與古蹟", emoji: "🏯", tags: ["history", "culture"] },
          { text: "找一個漂亮的地方看風景", emoji: "🌿", tags: ["nature", "water"] },
          { text: "一路尋找好吃的餐廳與小吃", emoji: "🍲", tags: ["food", "local"] }
        ]
      },

      {
        title: "妳喜歡什麼樣的旅行節奏？",
        description: "每個人的旅行步調都不同，選擇妳舒服的方式。",
        type: "single",
        options: [
          { text: "豐富充實：每天都想探索新地方", emoji: "🚶", tags: ["active", "history", "city"] },
          { text: "適中平衡：景點與休息都要有", emoji: "🌼", tags: ["balanced"] },
          { text: "悠閒慢遊：不趕時間，慢慢感受", emoji: "🍵", tags: ["slow", "relax"] },
          { text: "隨興自在：看到喜歡的地方就停留", emoji: "🦋", tags: ["flexible", "relax"] }
        ]
      },

      {
        title: "哪一種風景最讓妳心動？",
        description: "最多選擇兩種，想像自己就在那個地方。",
        type: "multi",
        max: 2,
        options: [
          { text: "摩登天際線與璀璨夜景", emoji: "🌆", tags: ["city", "night"] },
          { text: "江南水鄉與古典園林", emoji: "🏡", tags: ["water", "culture", "history"] },
          { text: "山川河流與壯麗自然", emoji: "⛰️", tags: ["nature", "mountain", "water"] },
          { text: "古城街道與歷史建築", emoji: "🏮", tags: ["history", "culture"] },
          { text: "花園、湖泊與悠閒街景", emoji: "🌸", tags: ["nature", "water", "relax"] }
        ]
      },

      {
        title: "旅行中的美食偏好？",
        description: "選出最多兩種妳最想體驗的飲食方式。",
        type: "multi",
        max: 2,
        options: [
          { text: "精緻餐廳與特色料理", emoji: "🍽️", tags: ["finefood"] },
          { text: "道地小吃與街頭美食", emoji: "🥟", tags: ["food", "local"] },
          { text: "茶館、咖啡館與甜點", emoji: "☕", tags: ["relax", "cafe"] },
          { text: "在地市場與傳統風味", emoji: "🍜", tags: ["food", "local", "culture"] }
        ]
      },

      {
        title: "旅行時，妳最在意哪些事情？",
        description: "選擇最多三項，希望旅程能避開的困擾。",
        type: "multi",
        max: 3,
        options: [
          { text: "不想走太多路，想減少體力負擔", emoji: "🪑", penalty: "walking" },
          { text: "不喜歡人潮擁擠的地方", emoji: "👥", penalty: "crowds" },
          { text: "不想頻繁換飯店或搬行李", emoji: "🧳", penalty: "transit" },
          { text: "不喜歡陡坡、階梯與高低落差", emoji: "⛰️", penalty: "stairs" },
          { text: "不喜歡太熱或太冷的天氣", emoji: "🌤️", penalty: "climate" }
        ]
      },

      {
        title: "妳希望這趟旅行留下什麼回憶？",
        description: "選擇最符合妳內心期待的一種。",
        type: "single",
        options: [
          { text: "看見繁華城市，感受世界的精彩", emoji: "🌃", tags: ["city", "night"] },
          { text: "走進歷史，感受文化的深度", emoji: "🏯", tags: ["history", "culture"] },
          { text: "被美麗的大自然療癒", emoji: "🌿", tags: ["nature", "relax"] },
          { text: "吃遍美食，享受生活的滋味", emoji: "🍜", tags: ["food", "local"] },
          { text: "放慢腳步，好好享受每一刻", emoji: "☀️", tags: ["slow", "relax"] }
        ]
      }

    ];

    /* =========================================
       二、建立目的地資料與風險評估
       risks 數字越高，代表該項旅行負擔越明顯
       ========================================= */

    const destinations = [
      {
        name: "上海",
        tags: ["city", "shopping", "night", "finefood", "cafe", "culture"],
        description: "現代城市與歷史風情交織，適合喜歡購物、夜景與多元生活體驗的妳。",
        risks: { walking: 3, crowds: 5, transit: 2, stairs: 2, climate: 3 }
      },
      {
        name: "杭州",
        tags: ["nature", "water", "relax", "slow", "cafe", "culture"],
        description: "湖光山色與茶文化相伴，適合喜歡自然風景、悠閒步調的妳。",
        risks: { walking: 3, crowds: 3, transit: 2, stairs: 2, climate: 3 }
      },
      {
        name: "成都",
        tags: ["food", "local", "relax", "slow", "cafe", "culture"],
        description: "美食與慢生活交織，適合想品嚐在地料理、享受悠閒生活的妳。",
        risks: { walking: 2, crowds: 3, transit: 2, stairs: 1, climate: 3 }
      },
      {
        name: "重慶",
        tags: ["city", "night", "food", "local", "mountain"],
        description: "層層疊疊的山城景觀與熱鬧夜景，適合喜歡城市探索與特色美食的妳。",
        risks: { walking: 5, crowds: 5, transit: 4, stairs: 5, climate: 4 }
      },
      {
        name: "蘇州",
        tags: ["water", "culture", "history", "slow", "relax"],
        description: "古典園林與水鄉風情相映，適合喜歡文化、傳統建築與慢遊的妳。",
        risks: { walking: 3, crowds: 3, transit: 2, stairs: 1, climate: 3 }
      },
      {
        name: "西安",
        tags: ["history", "culture", "food", "local"],
        description: "千年古城與豐富飲食文化，適合喜歡歷史探索與在地美食的妳。",
        risks: { walking: 4, crowds: 4, transit: 3, stairs: 3, climate: 4 }
      },
      {
        name: "桂林",
        tags: ["nature", "mountain", "water", "relax"],
        description: "山水如畫，河流與喀斯特地形交織，適合喜歡自然景觀的妳。",
        risks: { walking: 3, crowds: 3, transit: 4, stairs: 2, climate: 3 }
      },
      {
        name: "昆明",
        tags: ["nature", "relax", "slow", "water", "cafe"],
        description: "氣候相對溫和，擁有湖泊與自然景觀，適合喜歡舒適步調的妳。",
        risks: { walking: 3, crowds: 2, transit: 3, stairs: 2, climate: 1 }
      }
    ];

    /* =========================================
       三、保存作答狀態
       answers 的每個位置保存該題選中的選項索引
       ========================================= */

    let currentQuestion = 0;

    let answers = questions.map(() => []);

    /* =========================================
       四、開始測驗
       ========================================= */

    function startQuiz() {
      document.getElementById("home").classList.add("hidden");
      document.getElementById("result").classList.add("hidden");
      document.getElementById("quiz").classList.remove("hidden");

      currentQuestion = 0;
      renderQuestion();
    }

    /* =========================================
       五、顯示目前題目與選項
       ========================================= */

    function renderQuestion() {
      const question = questions[currentQuestion];

      document.getElementById("question-number").textContent =
        "QUESTION " + String(currentQuestion + 1).padStart(2, "0");

      document.getElementById("question-title").textContent =
        question.title;

      document.getElementById("question-description").textContent =
        question.description;

      /* 更新進度條 */
      const percent = Math.round(
        ((currentQuestion + 1) / questions.length) * 100
      );

      document.getElementById("progress-label").textContent =
        `第 ${currentQuestion + 1} 題，共 ${questions.length} 題`;

      document.getElementById("progress-percent").textContent =
        percent + "%";

      document.getElementById("progress-fill").style.width =
        percent + "%";

      /* 依據題目資料建立選項按鈕 */
      const container = document.getElementById("options-container");

      container.innerHTML = "";

      question.options.forEach((option, index) => {
        const button = document.createElement("button");

        button.className = "option";

        button.type = "button";

        button.innerHTML =
          `<span class="emoji">${option.emoji}</span>${option.text}`;

        /* 判斷這個選項是否已經被選取 */
        if (answers[currentQuestion].includes(index)) {
          button.classList.add("selected");
        }

        button.addEventListener("click", () => {
          toggleOption(index);
        });

        container.appendChild(button);
      });

      /* 第一題不顯示上一題按鈕 */
      document.getElementById("prev-btn").disabled =
        currentQuestion === 0;

      /* 最後一題改成完成按鈕 */
      document.getElementById("next-btn").textContent =
        currentQuestion === questions.length - 1
          ? "揭曉結果 ✨"
          : "下一題 →";

      document.getElementById("hint").textContent = "";
    }

    /* =========================================
       六、處理選項選取
       複選題依照 max 限制選取數量
       單選題只保留一個選項
       ========================================= */

    function toggleOption(index) {
      const question = questions[currentQuestion];

      const selected = answers[currentQuestion];

      if (question.type === "single") {

        /* 單選題：再次點擊同一個選項可取消 */
        answers[currentQuestion] =
          selected.includes(index) ? [] : [index];

      } else {

        /* 複選題：已選取的選項再次點擊可取消 */
        if (selected.includes(index)) {

          answers[currentQuestion] =
            selected.filter(item => item !== index);

        } else {

          /* 超過選取上限時提示使用者 */
          if (selected.length >= question.max) {
            document.getElementById("hint").textContent =
              `這一題最多選擇 ${question.max} 項喔。`;
            return;
          }

          answers[currentQuestion].push(index);
        }
      }

      renderQuestion();
    }

    /* =========================================
       七、上一題與下一題
       每一題至少需要選擇一個答案
       ========================================= */

    function previousQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      /* 防止使用者漏答 */
/* 第七題是旅行顧慮，允許使用者不選任何項目 */
if (
  answers[currentQuestion].length === 0 &&
  currentQuestion !== 6
) {
  document.getElementById("hint").textContent =
    "先選擇一個最符合妳心意的答案吧。";
  return;
}

      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    /* =========================================
       八、計算目的地推薦分數
       每個偏好標籤吻合時加分
       使用者的旅行顧慮則依目的地風險扣分
       ========================================= */

    function calculateResults() {


/* =========================================
   八、計算目的地推薦分數
   分成偏好吻合度與旅行顧慮扣分兩部分
   ========================================= */

function calculateResults() {

  /* 每一題的權重，數字越大代表影響越大 */
  const questionWeights = [
    1.5, // 第一題：旅行風格
    1.5, // 第二題：旅行期待
    1.0, // 第三題：理想的一天
    1.5, // 第四題：旅行節奏
    1.5, // 第五題：喜歡的風景
    1.0, // 第六題：美食偏好
    0,   // 第七題：旅行顧慮，獨立計算扣分
    1.5  // 第八題：旅行回憶
  ];

  /* 逐一計算八個目的地的分數 */
  const results = destinations.map(destination => {

    let weightedMatch = 0;
    let totalWeight = 0;

    let matchedTags = [];
    let penalties = [];

    /* 第一部分：計算旅行偏好吻合度 */
    questions.forEach((question, questionIndex) => {

      /* 第七題屬於旅行顧慮，跳過偏好加分 */
      if (questionIndex === 6) return;

      const selectedOptions = answers[questionIndex];

      /* 沒有作答的題目不納入計算 */
      if (selectedOptions.length === 0) return;

      const weight = questionWeights[questionIndex];

      let optionMatches = [];

      selectedOptions.forEach(optionIndex => {

        const option = question.options[optionIndex];

        /* 取得此選項對應的偏好標籤 */
        const tags = option.tags || [];

        if (tags.length === 0) return;

        /* 計算這個選項與目的地的標籤重疊比例 */
        const matchedCount = tags.filter(tag =>
          destination.tags.includes(tag)
        ).length;

        const matchRate = matchedCount / tags.length;

        optionMatches.push(matchRate);

        /* 記錄吻合度較高的選項，供結果頁解釋 */
        if (matchRate >= 0.5) {
          matchedTags.push(option.text);
        }

      });

      /* 同一題的多個答案先取平均，避免重複加分 */
      if (optionMatches.length > 0) {

        const questionMatch =
          optionMatches.reduce((sum, value) => sum + value, 0)
          / optionMatches.length;

        weightedMatch += questionMatch * weight;

        totalWeight += weight;
      }

    });

    /* 將偏好吻合度轉換成 0～100 分 */
    const preferenceScore = totalWeight > 0
      ? (weightedMatch / totalWeight) * 100
      : 0;

    /* 第二部分：計算旅行顧慮扣分 */
    let constraintPenalty = 0;

    answers[6].forEach(optionIndex => {

      const option = questions[6].options[optionIndex];

      /* 讀取目的地在這項顧慮上的風險評估 */
      const risk = destination.risks[option.penalty] ?? 1;

      /*
        風險分數為 1～5：
        1 分不扣分，5 分扣 10 分
        每項顧慮獨立計算
      */
      const deduction = (risk - 1) * 2.5;

      constraintPenalty += deduction;

      /* 風險達 4 分以上，列入旅行注意事項 */
      if (risk >= 4) {
        penalties.push(option.text);
      }

    });

    /* 顧慮扣分最多 30 分，避免單一維度過度主導 */
    constraintPenalty = Math.min(constraintPenalty, 30);

    /* 第三部分：計算最終配對分數 */
    const finalScore = Math.max(
      0,
      preferenceScore - constraintPenalty
    );

    return {
      ...destination,
      score: finalScore,
      preferenceScore: preferenceScore,
      constraintPenalty: constraintPenalty,
      matchedTags: [...new Set(matchedTags)],
      penalties: [...new Set(penalties)]
    };

  });

  /* 依照最終分數由高至低排列 */
  return results.sort((a, b) => b.score - a.score);

    }

    /* =========================================
       九、顯示前三名推薦結果
       ========================================= */

    function showResults() {

      const results = calculateResults();

      const topThree = results.slice(0, 3);

      const resultList = document.getElementById("result-list");

      resultList.innerHTML = "";

      topThree.forEach((destination, index) => {

        const card = document.createElement("div");

        card.className = "result-card";

        const rankNames = ["第一名", "第二名", "第三名"];

        const penaltyText = destination.penalties.length > 0
          ? `<p>值得留意：${destination.penalties.join("、")}</p>`
          : "";


/* 顯示偏好吻合度、顧慮扣分與綜合分數 */
/* 顯示推薦理由及三種分數 */
card.innerHTML = `
  <div class="rank">${rankNames[index]}推薦</div>

  <div class="destination-name">${destination.name}</div>

  <div class="result-description">
    ${destination.description}
  </div>

  <div class="score-label">
    偏好吻合度：${destination.preferenceScore.toFixed(1)} 分
  </div>

  <div class="score-label">
    旅行顧慮扣分：-${destination.constraintPenalty.toFixed(1)} 分
  </div>

  <div class="score-label">
    綜合配對分數：${destination.score.toFixed(1)} 分
  </div>

  ${
    destination.penalties.length > 0
      ? `<p>值得留意：${destination.penalties.join("、")}</p>`
      : ""
  }
`;


        resultList.appendChild(card);

      });

      document.getElementById("quiz").classList.add("hidden");

      document.getElementById("result").classList.remove("hidden");

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* =========================================
       十、重新開始測驗
       清空所有答案，回到首頁
       ========================================= */

    function restartQuiz() {

      answers = questions.map(() => []);

      currentQuestion = 0;

      document.getElementById("result").classList.add("hidden");

      document.getElementById("quiz").classList.add("hidden");

      document.getElementById("home").classList.remove("hidden");

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

  </script>

</body>
